<!-- Trang Hỏi đáp có 19 câu. Mở hết ra thì trang dài hơn tám nghìn pixel, và
     người đọc phải cuộn qua mười tám câu không liên quan mới tới câu của mình.
     Trên màn hình hẹp, mỗi khối .faq được bọc thành một thẻ details để gập lại.
     Chỉ đổi cách bày, không đụng tới chữ trong file .qmd, và màn hình rộng giữ
     nguyên như cũ. Người tắt JavaScript thấy toàn bộ câu trả lời mở sẵn, tức
     là đúng trạng thái hiện nay. -->
<script>
(function () {
  if (!window.matchMedia || !window.matchMedia('(max-width: 767px)').matches) return;

  document.querySelectorAll('.faq').forEach(function (khoi) {
    var cauHoi = khoi.querySelector('h3');
    if (!cauHoi) return;

    var gap = document.createElement('details');
    gap.className = 'faq-gap';

    var nhan = document.createElement('summary');
    // Giữ nguyên thẻ h3 bên trong summary, để cấu trúc tiêu đề của trang
    // không đổi và trình đọc màn hình vẫn duyệt qua từng câu hỏi như trước.
    nhan.appendChild(cauHoi);
    gap.appendChild(nhan);

    // Phần còn lại của khối là câu trả lời, dời hết vào trong thẻ details
    while (khoi.firstChild) gap.appendChild(khoi.firstChild);
    khoi.appendChild(gap);
  });

  // Mở sẵn đúng câu mà người đọc vừa bấm tới từ một liên kết neo
  function moTheoNeo() {
    if (!location.hash) return;
    var dich = document.querySelector(location.hash);
    if (!dich) return;
    var gap = dich.closest('.faq-gap');
    if (gap) gap.open = true;
  }
  moTheoNeo();
  window.addEventListener('hashchange', moTheoNeo);
})();
</script>

<!-- Mục lục trong trang, chỉ dựng trên màn hình hẹp.
     Trang chủ dài chừng mười ba màn hình cuộn, trang Về mình mười bảy. Trên
     màn hình rộng người đọc liếc một cái là nắm được trang có những mục nào,
     còn trên điện thoại thì không, nên phải cuộn mò. Khối này liệt kê các mục
     lớn ngay đầu trang, gập sẵn, bấm vào là nhảy thẳng tới nơi.
     Chỉ dựng khi trang có từ bốn mục trở lên, trang ngắn không cần. -->
<script>
(function () {
  if (!window.matchMedia || !window.matchMedia('(max-width: 767px)').matches) return;

  var than = document.querySelector('main.content');
  if (!than) return;

  var muc = Array.prototype.filter.call(than.querySelectorAll('h2'), function (h) {
    return h.id && h.textContent.trim();
  });
  if (muc.length < 4) return;

  var hop = document.createElement('details');
  hop.className = 'muc-luc';

  var nhan = document.createElement('summary');
  nhan.textContent = 'Trong trang này · ' + muc.length + ' mục';
  hop.appendChild(nhan);

  var ds = document.createElement('ol');
  muc.forEach(function (h) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.trim();
    // Bấm xong thì gập lại, để phần chữ không bị đẩy xuống khi tới nơi
    a.addEventListener('click', function () { hop.open = false; });
    li.appendChild(a);
    ds.appendChild(li);
  });
  hop.appendChild(ds);

  // Đặt ngay dưới khối mở đầu, trên mục lớn đầu tiên
  var khoiDau = than.querySelector('.hero');
  if (khoiDau && khoiDau.nextSibling) {
    than.insertBefore(hop, khoiDau.nextSibling);
  } else {
    than.insertBefore(hop, than.firstChild);
  }
})();
</script>

<!-- Đưa thanh giới thiệu dịch vụ vào trong khối header cố định của Quarto.
     Làm vậy thì thanh khoá luôn ở đầu màn hình, và Quarto vẫn tự tính đúng
     khoảng chừa phía trên của thân trang cũng như vị trí của các liên kết
     neo như #g0 hay #phan-mem. Đoạn này chạy ngay lúc trang đang dựng, tức
     là trước khi Quarto chạy phần tính toán của nó.
     Người tắt JavaScript vẫn đọc được thanh, chỉ là nó nằm trong dòng chảy
     của trang và trượt đi theo nội dung. -->
<script>
(function () {
  var thanh = document.querySelector('.thanh-dich-vu');
  var khoiDau = document.getElementById('quarto-header');
  if (thanh && khoiDau && !khoiDau.contains(thanh)) {
    khoiDau.insertBefore(thanh, khoiDau.firstChild);
  }
})();
</script>

<script>
(function () {
  var itMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Đếm số từ 0 lên giá trị thật
  function demSo(el) {
    var dich = parseFloat(el.getAttribute('data-dem'));
    var duoi = el.getAttribute('data-duoi') || '';
    if (isNaN(dich)) return;
    if (itMotion) { el.textContent = dich + duoi; return; }

    var batDau = null;
    var thoiGian = 1100;

    function buoc(mocThoiGian) {
      if (batDau === null) batDau = mocThoiGian;
      var tien = Math.min((mocThoiGian - batDau) / thoiGian, 1);
      var muot = 1 - Math.pow(1 - tien, 3);
      el.textContent = Math.round(dich * muot) + duoi;
      if (tien < 1) requestAnimationFrame(buoc);
    }
    requestAnimationFrame(buoc);
  }

  var daChay = new WeakSet();

  function chayMot(s) {
    if (daChay.has(s)) return;
    daChay.add(s);
    demSo(s);
  }

  function hienThi(el) {
    el.classList.add('hien');
    el.querySelectorAll('[data-dem]').forEach(chayMot);
  }

  var canQuanSat = document.querySelectorAll('.reveal');

  // Con số thật nằm sẵn trong HTML để người tắt JavaScript vẫn đọc được.
  // Chỉ khi tới đây, tức là JavaScript đang chạy, mới hạ về 0 để đếm lên.
  if (!itMotion) {
    document.querySelectorAll('[data-dem]').forEach(function (s) {
      s.textContent = '0' + (s.getAttribute('data-duoi') || '');
    });
  }

  if (!('IntersectionObserver' in window)) {
    canQuanSat.forEach(hienThi);
    return;
  }

  var quanSat = new IntersectionObserver(function (danhSach) {
    danhSach.forEach(function (muc) {
      if (muc.isIntersecting) {
        hienThi(muc.target);
        quanSat.unobserve(muc.target);
      }
    });
  }, { threshold: 0.18, rootMargin: '0px 0px -40px 0px' });

  canQuanSat.forEach(function (el) { quanSat.observe(el); });

  // Lưới an toàn: nếu vì lý do nào đó bộ quan sát không báo về, các con số
  // vẫn phải trở lại giá trị thật thay vì đứng mãi ở số 0.
  setTimeout(function () {
    document.querySelectorAll('[data-dem]').forEach(chayMot);
  }, 4000);
})();
</script>
